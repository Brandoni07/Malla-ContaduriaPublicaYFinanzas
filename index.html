<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Malla Curricular - Contaduría Pública y Finanzas UNAH</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .malla {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 20px;
    }
    .periodo {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 10px;
    }
    .periodo h2 {
      font-size: 1rem;
      text-align: center;
      background: #2e86c1;
      color: white;
      padding: 8px;
      border-radius: 8px;
    }
    .materia {
      margin: 8px 0;
      padding: 6px;
      border-radius: 6px;
      background: #eaf2f8;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.9em;
      position: relative;
    }
    .materia:hover {
      background: #d6eaf8;
    }
    .materia.aprobada {
      background: #d5f5e3 !important;
      text-decoration: line-through;
    }
    .materia.bloqueada {
      background: #f5b7b1 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .materia[title] {
      position: relative;
    }
    .materia[title]:hover::after {
      content: attr(title);
      position: absolute;
      left: 0;
      top: 100%;
      background: #333;
      color: #fff;
      font-size: 0.75em;
      padding: 5px;
      border-radius: 4px;
      white-space: pre;
      z-index: 100;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>Malla Curricular - Contaduría Pública y Finanzas (UNAH)</h1>
  <div class="malla" id="malla"></div>

  <script>
    const malla = {
      "Primer Período": [
        { id: "FF-101", nombre: "Filosofía" },
        { id: "HH-101", nombre: "Historia de Honduras" },
        { id: "DET-175", nombre: "Métodos Cuantitativos I" },
        { id: "EG-011", nombre: "Español General" },
        { id: "SC-101", nombre: "Sociología" }
      ],
      "Segundo Período": [
        { id: "EG-025", nombre: "Redacción General", requiere: ["EG-011"] },
        { id: "DET-280", nombre: "Métodos Cuantitativos II", requiere: ["DET-175"] },
        { id: "BI-130", nombre: "Educación Ambiental" },
        { id: "RR-150", nombre: "Educación Artística" },
        { id: "CF-171", nombre: "Cultura Física" },
        { id: "CE-020", nombre: "Principios de Economía", requiere: ["DET-175"] }
      ],
      "Tercer Período": [
        { id: "CPE-0103", nombre: "Derecho Mercantil y Laboral", requiere: ["SC-101"] },
        { id: "CPE-0203", nombre: "Introducción a la contabilidad", requiere: ["DET-280"] },
        { id: "DET-385", nombre: "Métodos Cuantitativos III", requiere: ["DET-280"] },
        { id: "CE-084", nombre: "Microeconomía I", requiere: ["CE-020", "DET-280"] },
        { id: "IN-101", nombre: "Inglés I" }
      ],
      "Cuarto Período": [
        { id: "CPE-0304", nombre: "Contabilidad Financiera I", requiere: ["CPE-0203"] },
        { id: "CPE-0404", nombre: "Administración", requiere: ["CPE-0103"] },
        { id: "CE-075", nombre: "Macroeconomía", requiere: ["CE-020"] },
        { id: "CE-094", nombre: "Matemática Financiera", requiere: ["DET-385"] },
        { id: "IN-102", nombre: "Inglés II", requiere: ["IN-101"] }
      ],
      "Quinto Período": [
        { id: "CPE-0505", nombre: "Contabilidad Financiera II", requiere: ["CPE-0304"] },
        { id: "CPE-0605", nombre: "Tecnología de Información y Comunicación", requiere: ["CPE-0304"] },
        { id: "CPE-0705", nombre: "Derecho Administrativo", requiere: ["CPE-0304"] },
        { id: "AGE-337", nombre: "Gerencia de Negocios", requiere: ["AGE-102"] },
        { id: "AGE-113", nombre: "Desarrollo Gerencial", requiere: ["AGE-102"] }
      ],
      "Sexto Período": [
        { id: "CPE-0906", nombre: "Contabilidad de Sociedades Mercantiles", requiere: ["CPE-0505", "CPE-0103"] },
        { id: "CPE-1006", nombre: "Costos Industriales", requiere: ["CPE-0505"] },
        { id: "CPE-1106", nombre: "Análisis de Estados Financieros", requiere: ["CPE-0505"] },
        { id: "AGE-194", nombre: "Análisis cuantitativo I", requiere: ["DET-385"] },
        { id: "AGE-215", nombre: "Desarrollo de Capital Humano", requiere: ["AGE-113"] }
      ],
      "Séptimo Período": [
        { id: "CPE-1207", nombre: "Contabilidad Avanzada", requiere: ["CPE-0906"] },
        { id: "CPE-1307", nombre: "Costos Gerenciales", requiere: ["CPE-1006"] },
        { id: "CPE-1407", nombre: "Finanzas Corporativas", requiere: ["CPE-1106"] },
        { id: "CPE-1507", nombre: "Contabilidad Gubernamental", requiere: ["CPE-0906"] }
      ],
      "Octavo Período": [
        { id: "CPE-1608", nombre: "Contabilidad Gerencial", requiere: ["CPE-1307"] },
        { id: "CPE-1708", nombre: "Informática Aplicada", requiere: ["CPE-1407"] },
        { id: "CE-176", nombre: "Finanzas Públicas", requiere: ["CPE-1507"] },
        { id: "CPE-1808", nombre: "Fundamentos de Auditoría", requiere: ["CPE-1407"] }
      ],
      "Noveno Período": [
        { id: "CPE-1909", nombre: "Seminario Tributario Contable", requiere: ["CPE-1808"] },
        { id: "CE-094", nombre: "Métodos y Técnicas de Investigación", requiere: ["CE-176"] },
        { id: "CPE-2009", nombre: "Mercado de Dinero y Capitales", requiere: ["CE-176"] },
        { id: "CPE-2109", nombre: "Auditoría Financiera", requiere: ["CPE-1808"] }
      ],
      "Décimo Período": [
        { id: "CPE-2210", nombre: "Estrategias Financieras y Fiscales", requiere: ["CPE-2009"] },
        { id: "CPE-2310", nombre: "Organización Administrativa y Financiera", requiere: ["CE-094"] },
        { id: "CPE-2410", nombre: "Contabilidad para Entidades Reguladas", requiere: ["CPE-2009"] },
        { id: "CPE-2510", nombre: "Auditoría Interna", requiere: ["CPE-2109"] }
      ],
      "Undécimo Período": [
        { id: "CPE-2611", nombre: "Sistema de Gestión de Riesgos", requiere: ["CPE-2410"] },
        { id: "CPE-2711", nombre: "Normativa Contable Internacional", requiere: ["CPE-2510"] },
        { id: "CPE-2811", nombre: "Auditoría de Entidades Reguladas", requiere: ["CPE-2510"] },
        { id: "CPE-2911", nombre: "Ética Profesional", requiere: ["CPE-2510"] }
      ],
      "Duodécimo Período": [
        { id: "CPE-3012", nombre: " Análisis y Evaluación de Proyectos de Inversión", requiere: ["CPE-2811"] },
        { id: "CPE-3112", nombre: "Investigación Financiera", requiere: ["CPE-2711"] },
        { id: "CPE-3212", nombre: "Auditoría de Sistemas Informáticos", requiere: ["CPE-2811"] },
        { id: "CPE-3312", nombre: "Gestión Integral de Riesgo", requiere: ["CPE-2611"] }
      ],
      "Décimo Tercer Período": [
        { id: "CPE-3413", nombre: "Proyecto de Investigación", requiere: ["CPE-3012", "CPE-3112", "CPE-3212", "CPE-3312", "CPE-2611"] }
      ]
    };

    const aprobadas = JSON.parse(localStorage.getItem("materiasAprobadas") || "[]");

    function crearMalla() {
      const contenedor = document.getElementById("malla");
      contenedor.innerHTML = "";

      Object.entries(malla).forEach(([periodo, materias]) => {
        const div = document.createElement("div");
        div.className = "periodo";
        div.innerHTML = `<h2>${periodo}</h2>`;

        materias.forEach(mat => {
          const el = document.createElement("div");
          el.className = "materia";
          el.dataset.id = mat.id;
          el.textContent = `${mat.id} - ${mat.nombre}`;

          const requisitos = mat.requiere || [];
          const faltantes = requisitos.filter(r => !aprobadas.includes(r));

          if (aprobadas.includes(mat.id)) el.classList.add("aprobada");
          else if (faltantes.length) {
            el.classList.add("bloqueada");
            el.title = "Requiere: " + faltantes.join(", ");
          }

          el.addEventListener("click", () => {
            if (el.classList.contains("bloqueada")) return;
            const id = mat.id;
            const index = aprobadas.indexOf(id);
            if (index === -1) aprobadas.push(id);
            else aprobadas.splice(index, 1);
            localStorage.setItem("materiasAprobadas", JSON.stringify(aprobadas));
            crearMalla();
          });

          div.appendChild(el);
        });

        contenedor.appendChild(div);
      });
    }

    crearMalla();
  </script>
</body>
</html>
